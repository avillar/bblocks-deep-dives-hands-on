  - $ref: bblocks://ogc.ogc-utils.prov-entity
  - type: object
    properties:
      properties:
        type: object
        properties:
          hasFeatureOfInterest:
            $ref: bblocks://ogc.ogc-utils.iri-or-curie
          hasResult:
            $ref: bblocks://ogc.deepdive.waterBodySurveyResult
        required: [resultTime, hasFeatureOfInterest, observedProperty, hasResult]
        